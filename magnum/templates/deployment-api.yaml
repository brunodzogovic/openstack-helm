{{- if .Values.manifests.deployment_api }}
{{- $envAll := . }}

{{- $mounts_magnum_api := .Values.pod.mounts.magnum_api.magnum_api }}
{{- $mounts_magnum_api_init := .Values.pod.mounts.magnum_api.init_container }}
{{- $capiBootstrap := default (dict) .Values.conf.capi_driver_bootstrap }}
{{- $capiBootstrapEnabled := default false (get $capiBootstrap "enabled") }}
{{- $capiDriverVersion := default "1.4.0" (get $capiBootstrap "version") }}
{{- $capiConstraints := default "https://raw.githubusercontent.com/openstack/requirements/stable/2026.1/upper-constraints.txt" (get $capiBootstrap "constraints_url") }}

{{- $serviceAccountName := "magnum-api" }}
{{ tuple $envAll "api" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnum-api
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "magnum" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.api }}
  selector:
    matchLabels:
{{ tuple $envAll "magnum" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "magnum" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "magnum_api" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
{{ tuple "magnum_api" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "magnum_api" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
      affinity:
{{ tuple $envAll "magnum" "api" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.api.node_selector_key }}: {{ .Values.labels.api.node_selector_value }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.api.timeout | default "30" }}
      initContainers:
{{- if $capiBootstrapEnabled }}
        - name: capi-driver-bootstrap
{{ tuple $envAll "capi_driver_bootstrap" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -ec
            - |
              rm -rf /opt/magnum-capi-driver/*
              # Keep the 2026.1 Magnum runtime and its constrained libraries
              # authoritative. Only stage the external driver package itself.
              python3 -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-deps \
                --target /opt/magnum-capi-driver \
                --constraint "{{ $capiConstraints }}" \
                "magnum-capi-helm=={{ $capiDriverVersion }}"
              # magnum-capi-helm 1.4.0 understands literal bearer tokens but
              # not kubeconfig tokenFile. Eclipse uses projected SA tokens so
              # the token remains short-lived and is rotated by Kubernetes.
              # Teach the staged driver to read tokenFile initially and before
              # every management-cluster request. Fail closed if upstream source
              # no longer matches the audited 1.4.0 layout.
              python3 - <<'PY'
              from pathlib import Path

              path = Path('/opt/magnum-capi-driver/magnum_capi_helm/kubernetes.py')
              text = path.read_text()
              marker = 'ECLIPSE_PROJECTED_TOKEN_FILE'
              if marker not in text:
                  old_auth = '''        elif user.get("token"):\n            self.headers.update({"Authorization": f"Bearer {user['token']}"})\n        else:\n'''
                  new_auth = '''        elif user.get("tokenFile"):\n            # ECLIPSE_PROJECTED_TOKEN_FILE: support rotating projected SA tokens.\n            self._token_file = user["tokenFile"]\n            token = pathlib.Path(self._token_file).read_text().strip()\n            self.headers.update({"Authorization": f"Bearer {token}"})\n        elif user.get("token"):\n            self.headers.update({"Authorization": f"Bearer {user['token']}"})\n        else:\n'''
                  old_request = '''    def request(self, method, url, *args, **kwargs):\n        # Make sure to add the server to any relative URLs\n'''
                  new_request = '''    def request(self, method, url, *args, **kwargs):\n        token_file = getattr(self, "_token_file", None)\n        if token_file:\n            token = pathlib.Path(token_file).read_text().strip()\n            self.headers.update({"Authorization": f"Bearer {token}"})\n        # Make sure to add the server to any relative URLs\n'''
                  if text.count(old_auth) != 1 or text.count(old_request) != 1:
                      raise SystemExit('magnum-capi-helm 1.4.0 token patch source contract changed')
                  text = text.replace(old_auth, new_auth, 1).replace(old_request, new_request, 1)
                  path.write_text(text)
              if marker not in path.read_text():
                  raise SystemExit('projected tokenFile compatibility patch not installed')
              PY
              PYTHONPATH=/opt/magnum-capi-driver python3 -c "import importlib.metadata as m; eps=[ep.name for ep in m.entry_points(group='magnum.drivers')]; assert 'k8s_capi_helm_v1' in eps, f'CAPI Helm Magnum driver entry point missing: {eps}'; print('magnum-capi-helm {{ $capiDriverVersion }} ready:', eps)"
          volumeMounts:
            - name: magnum-capi-driver
              mountPath: /opt/magnum-capi-driver
{{- end }}
{{ tuple $envAll "api" $mounts_magnum_api_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: magnum-api
{{ tuple $envAll "magnum_api" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.api | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          securityContext:
            runAsUser: {{ .Values.pod.user.magnum.uid }}
{{- if $capiBootstrapEnabled }}
          env:
            - name: PYTHONPATH
              value: /opt/magnum-capi-driver
{{- end }}
          command:
            - /tmp/magnum-api.sh
            - start
          lifecycle:
            preStop:
              exec:
                command:
                  - /tmp/magnum-api.sh
                  - stop
          ports:
            - name: m-api
              containerPort: {{ tuple "container-infra" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: {{ tuple "container-infra" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.magnum.oslo_concurrency.lock_path }}
            - name: magnum-bin
              mountPath: /tmp/magnum-api.sh
              subPath: magnum-api.sh
              readOnly: true
            - name: pod-etc-magnum
              mountPath: /etc/magnum
            - name: pod-var-cache-magnum
              mountPath: /var/cache/magnum
            - name: magnum-etc
              mountPath: /etc/magnum/magnum.conf
              subPath: magnum.conf
              readOnly: true
            - name: magnum-etc
              mountPath: /etc/magnum/magnum-api-uwsgi.ini
              subPath: magnum-api-uwsgi.ini
              readOnly: true
            {{- if .Values.conf.magnum.DEFAULT.log_config_append }}
            - name: magnum-etc
              mountPath: {{ .Values.conf.magnum.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.magnum.DEFAULT.log_config_append }}
              readOnly: true
            {{- end }}
            - name: magnum-etc
              mountPath: /etc/magnum/api-paste.ini
              subPath: api-paste.ini
              readOnly: true
            - name: magnum-etc
              mountPath: /etc/magnum/policy.yaml
              subPath: policy.yaml
              readOnly: true
            {{- if .Values.conf.capi.enabled }}
            - name: magnum-etc
              mountPath: /etc/magnum/kubeconfig.conf
              subPath: kubeconfig.conf
              readOnly: true
            {{- end }}
{{- if $capiBootstrapEnabled }}
            - name: magnum-capi-driver
              mountPath: /opt/magnum-capi-driver
              readOnly: true
{{- end }}
{{ if $mounts_magnum_api.volumeMounts }}{{ toYaml $mounts_magnum_api.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-magnum
          emptyDir: {}
        - name: pod-var-cache-magnum
          emptyDir: {}
{{- if $capiBootstrapEnabled }}
        - name: magnum-capi-driver
          emptyDir: {}
{{- end }}
        - name: magnum-bin
          configMap:
            name: magnum-bin
            defaultMode: 0555
        - name: magnum-etc
          secret:
            secretName: magnum-etc
            defaultMode: 0444
{{ if $mounts_magnum_api.volumes }}{{ toYaml $mounts_magnum_api.volumes | indent 8 }}{{ end }}
{{- end }}