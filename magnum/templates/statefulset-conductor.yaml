{{- if .Values.manifests.statefulset_conductor }}
{{- $envAll := . }}

{{- $mounts_magnum_conductor := .Values.pod.mounts.magnum_conductor.magnum_conductor }}
{{- $mounts_magnum_conductor_init := .Values.pod.mounts.magnum_conductor.init_container }}
{{- $capiBootstrap := default (dict) .Values.conf.capi_driver_bootstrap }}
{{- $capiBootstrapEnabled := default false (get $capiBootstrap "enabled") }}
{{- $capiDriverVersion := default "1.4.0" (get $capiBootstrap "version") }}
{{- $capiConstraints := default "https://raw.githubusercontent.com/openstack/requirements/stable/2026.1/upper-constraints.txt" (get $capiBootstrap "constraints_url") }}
{{- $helmVersion := default "3.20.0" (get $capiBootstrap "helm_version") }}
{{- $helmSha := get $capiBootstrap "helm_linux_amd64_sha256" }}

{{- $serviceAccountName := "magnum-conductor" }}
{{ tuple $envAll "conductor" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magnum-conductor
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "magnum" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  serviceName: magnum-conductor
  podManagementPolicy: "Parallel"
  replicas: {{ .Values.pod.replicas.conductor }}
  selector:
    matchLabels:
{{ tuple $envAll "magnum" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "magnum" "conductor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
{{ tuple "magnum_conductor" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "magnum_conductor" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
      affinity:
{{ tuple $envAll "magnum" "conductor" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.conductor.node_selector_key }}: {{ .Values.labels.conductor.node_selector_value }}
      initContainers:
{{- if $capiBootstrapEnabled }}
        - name: capi-driver-bootstrap
{{ tuple $envAll "capi_driver_bootstrap" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -ec
            - |
              rm -rf /opt/magnum-capi-driver/* /opt/helm/bin/*
              python3 -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --target /opt/magnum-capi-driver \
                --constraint "{{ $capiConstraints }}" \
                "magnum-capi-helm=={{ $capiDriverVersion }}"
              PYTHONPATH=/opt/magnum-capi-driver python3 -c "import importlib.metadata as m; eps=[ep.name for ep in m.entry_points(group='magnum.drivers')]; assert any('capi' in ep and 'helm' in ep for ep in eps), f'CAPI Helm Magnum driver entry point missing: {eps}'; print('magnum-capi-helm {{ $capiDriverVersion }} ready:', eps)"
              HELM_VERSION="{{ $helmVersion }}" HELM_SHA="{{ $helmSha }}" python3 - <<'PY'
              import hashlib, os, pathlib, tarfile, urllib.request
              version = os.environ['HELM_VERSION']
              expected = os.environ['HELM_SHA']
              url = f'https://get.helm.sh/helm-v{version}-linux-amd64.tar.gz'
              archive = '/tmp/helm.tar.gz'
              urllib.request.urlretrieve(url, archive)
              digest = hashlib.sha256(pathlib.Path(archive).read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f'Helm checksum mismatch: {digest} != {expected}')
              with tarfile.open(archive, 'r:gz') as tf:
                  member = tf.getmember('linux-amd64/helm')
                  src = tf.extractfile(member)
                  out = pathlib.Path('/opt/helm/bin/helm')
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(src.read())
                  out.chmod(0o755)
              print(f'Helm {version} ready: {digest}')
              PY
              /opt/helm/bin/helm version --short
          volumeMounts:
            - name: magnum-capi-driver
              mountPath: /opt/magnum-capi-driver
            - name: helm-bin
              mountPath: /opt/helm/bin
{{- end }}
{{ tuple $envAll "conductor" $mounts_magnum_conductor_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        - name: magnum-conductor-init
{{ tuple $envAll "magnum_conductor" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.conductor | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          securityContext:
            runAsUser: {{ .Values.pod.user.magnum.uid }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /tmp/magnum-conductor-init.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: magnum-bin
              mountPath: /tmp/magnum-conductor-init.sh
              subPath: magnum-conductor-init.sh
              readOnly: true
            - name: pod-shared
              mountPath: /tmp/pod-shared
      containers:
        - name: magnum-conductor
{{ tuple $envAll "magnum_conductor" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.conductor | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          securityContext:
            runAsUser: {{ .Values.pod.user.magnum.uid }}
{{- if $capiBootstrapEnabled }}
          env:
            - name: PYTHONPATH
              value: /opt/magnum-capi-driver
            - name: PATH
              value: /opt/helm/bin:/var/lib/openstack/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
{{- end }}
          command:
            - /tmp/magnum-conductor.sh
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.magnum.oslo_concurrency.lock_path }}
            - name: magnum-bin
              mountPath: /tmp/magnum-conductor.sh
              subPath: magnum-conductor.sh
              readOnly: true
            - name: pod-etc-magnum
              mountPath: /etc/magnum
            - name: magnum-etc
              mountPath: /etc/magnum/magnum.conf
              subPath: magnum.conf
              readOnly: true
            {{- if .Values.conf.magnum.DEFAULT.log_config_append }}
            - name: magnum-etc
              mountPath: {{ .Values.conf.magnum.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.magnum.DEFAULT.log_config_append }}
              readOnly: true
            {{- end }}
            {{- if .Values.conf.capi.enabled }}
            - name: magnum-etc
              mountPath: /etc/magnum/kubeconfig.conf
              subPath: kubeconfig.conf
              readOnly: true
            {{- end }}
            - name: magnum-etc
              mountPath: /etc/magnum/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: magnum-certificate-cache
              mountPath: {{ .Values.conf.magnum.cluster.temp_cache_dir }}
{{- if $capiBootstrapEnabled }}
            - name: magnum-capi-driver
              mountPath: /opt/magnum-capi-driver
              readOnly: true
            - name: helm-bin
              mountPath: /opt/helm/bin
              readOnly: true
{{- end }}
{{ if $mounts_magnum_conductor.volumeMounts }}{{ toYaml $mounts_magnum_conductor.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-magnum
          emptyDir: {}
        - name: pod-shared
          emptyDir: {}
{{- if $capiBootstrapEnabled }}
        - name: magnum-capi-driver
          emptyDir: {}
        - name: helm-bin
          emptyDir: {}
{{- end }}
        - name: magnum-bin
          configMap:
            name: magnum-bin
            defaultMode: 0555
        - name: magnum-etc
          secret:
            secretName: magnum-etc
            defaultMode: 0444
        - name: magnum-certificate-cache
          emptyDir: {}
{{ if $mounts_magnum_conductor.volumes }}{{ toYaml $mounts_magnum_conductor.volumes | indent 8 }}{{ end }}
{{- end }}