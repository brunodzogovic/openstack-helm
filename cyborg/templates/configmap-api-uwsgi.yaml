{{- if .Values.manifests.deployment_api }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cyborg-api-uwsgi
data:
  cyborg-api-uwsgi.ini: |
    [uwsgi]
    http-socket = 0.0.0.0:{{ tuple "accelerator" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
    module = cyborg.wsgi.api:application
    master = true
    processes = {{ default 2 .Values.conf.cyborg.api.api_workers }}
    enable-threads = true
    lazy-apps = true
    thunder-lock = true
    die-on-term = true
    exit-on-reload = false
    worker-reload-mercy = 90
    buffer-size = 65535
    add-header = Connection: close
    hook-master-start = unix_signal:15 gracefully_kill_them_all
    procname-prefix-spaced = cyborg-api:
    route-user-agent = ^kube-probe.* donotlog:
    need-app = true
{{- end }}
